name: Secret extraction report
description: Tell us whether tools/get_secret.py worked on your phone. Successes are as useful as failures.
title: "[secret] "
labels: ["secret-extraction"]

body:
  - type: markdown
    attributes:
      value: |
        This is the least proven part of the project. It has been confirmed on
        two phones and one app build. Every report moves that forward.

        **Do not paste your secret, or a screenshot containing it, anywhere in
        this issue.** It identifies your fountain. Nothing here needs it: say
        whether a value came out and how long it was, not what it was.

  - type: dropdown
    id: outcome
    attributes:
      label: What happened
      options:
        - It worked
        - It found the phone but no secret
        - It could not find the app
        - It could not find the phone or adb
        - Something else went wrong
    validations:
      required: true

  - type: input
    id: phone
    attributes:
      label: Phone
      description: Manufacturer and model.
      placeholder: OnePlus CPH2655
    validations:
      required: true

  - type: input
    id: android
    attributes:
      label: Android version
      placeholder: "16"
    validations:
      required: true

  - type: input
    id: app
    attributes:
      label: PetKit app package and version
      description: >
        The script prints the package. The version is in the app's own settings
        screen.
      placeholder: com.petkit.oversea 1.2.3
    validations:
      required: false

  - type: input
    id: fountain
    attributes:
      label: Fountain model
      description: >
        On the box or in the app. This project was built against the Eversweet
        Max 2 UVC (CTW3UV).
      placeholder: Eversweet Max 2 UVC
    validations:
      required: false

  - type: textarea
    id: output
    attributes:
      label: Script output
      description: >
        Paste what the script printed. It hides the secret by default, but read
        it over before posting anyway.
      render: text
    validations:
      required: false

  - type: textarea
    id: manual
    attributes:
      label: Did the manual route work?
      description: >
        If the script failed, try the commands under "By hand" in docs/secret.md
        and say whether the log file existed and whether it held a line with
        "secret" in it. Do not paste the line itself.
    validations:
      required: false
